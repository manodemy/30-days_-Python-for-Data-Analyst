<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manodemy Reel Canvas</title>
<!-- Master Font Palette -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@700;800;900&family=Anonymous+Pro:wght@700&family=Anton&family=Archivo+Black&family=Azeret+Mono:wght@600;700;800&family=Barlow:wght@700;800&family=Bebas+Neue&family=Bricolage+Grotesque:wght@700;800;900&family=Chakra+Petch:wght@700&family=Cousine:wght@700&family=DM+Mono:wght@500&family=DM+Sans:wght@700;800&family=Epilogue:wght@800;900&family=Figtree:wght@700;800;900&family=Fira+Code:wght@500;600;700&family=Gabarito:wght@700;800;900&family=Hanken+Grotesk:wght@700;800&family=IBM+Plex+Mono:wght@600;700&family=Inconsolata:wght@700&family=Inter+Tight:wght@800;900&family=JetBrains+Mono:wght@500;600;700;800&family=Jost:wght@700;800&family=Kanit:wght@800;900&family=Lexend+Mega:wght@800;900&family=Lexend:wght@700;800&family=Manrope:wght@700;800&family=Montserrat:wght@800;900&family=Mulish:wght@700;800&family=Nunito+Sans:wght@700;800;900&family=Oswald:wght@700&family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&family=Poppins:wght@700;800;900&family=PT+Mono&family=Quicksand:wght@700&family=Red+Hat+Mono:wght@600;700&family=Righteous&family=Roboto+Mono:wght@600;700&family=Rubik:wght@700;800;900&family=Russo+One&family=Share+Tech+Mono&family=Sora:wght@700;800&family=Source+Code+Pro:wght@600;700&family=Space+Grotesk:wght@700;900&family=Space+Mono:wght@700&family=Spline+Sans+Mono:wght@600;700&family=Syne:wght@700;800;900&family=Ubuntu+Mono:wght@700&family=Unbounded:wght@800;900&family=Urbanist:wght@700;800;900&family=Victor+Mono:wght@600;700&family=Work+Sans:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#00f0ff;
    --mint:#00f59b;
    --violet:#a855f7;
    --orchid:#c084fc;
    --pink:#ff007a;
    --yellow:#facc15;
    --ink:#04060a;
    --panel:#080a10;
    --paper:#ffffff;
    --muted:#7d8aa8;
    --font-hook: 'Plus Jakarta Sans', sans-serif;
    --font-code: 'JetBrains Mono', monospace;
    --font-poll: 'Plus Jakarta Sans', sans-serif;
    --font-badge: 'Plus Jakarta Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;height:100%;}

  /* ============ STAGE (9:16 VERTICAL) ============ */
  .reel-stage{
    container-type: inline-size;
    container-name: reel;
    position:relative;
    width:100%;
    aspect-ratio: 9/16;
    max-height:100%;
    margin:0 auto;
    background:
      radial-gradient(120% 60% at 50% -10%, #0d1422 0%, var(--ink) 55%),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    overflow:hidden;
    color:var(--paper);
    isolation:isolate;
  }
  .reel-stage::before{
    content:"";
    position:absolute; inset:0;
    box-shadow: inset 0 0 18cqw 2cqw rgba(0,0,0,0.85);
    pointer-events:none;
    z-index:5;
  }

  /* ============ STEP 1: HERO LOGO ============ */
  .logo-stage-container{
    position: absolute;
    top: 5.0cqw;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .logo-white-card{
    background: #ffffff;
    border-radius: 3.0cqw;
    padding: 1.1cqw 4.2cqw;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1.5cqw 4.5cqw rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 240, 255, 0.4);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .logo-white-card.logo-jump-active{
    animation: logoZoomJumpSettle 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes logoZoomJumpSettle{
    0% {
      transform: scale(0.2) translateY(-6cqw);
      opacity: 0;
      filter: blur(8px) drop-shadow(0 0 45px rgba(0, 240, 255, 0.95));
    }
    45% {
      transform: scale(1.22) translateY(1.5cqw);
      opacity: 1;
      filter: blur(0px) drop-shadow(0 0 35px rgba(0, 240, 255, 0.7));
    }
    68% {
      transform: scale(0.92) translateY(-0.6cqw);
    }
    84% {
      transform: scale(1.05) translateY(0.2cqw);
    }
    100% {
      transform: scale(1.0) translateY(0);
      opacity: 1;
      filter: drop-shadow(0 1.5cqw 4.5cqw rgba(0, 0, 0, 0.7)) drop-shadow(0 0 25px rgba(0, 240, 255, 0.35));
    }
  }

  .logo-white-card::after{
    content: "";
    position: absolute;
    top: -50%;
    left: -120%;
    width: 60%;
    height: 200%;
    background: linear-gradient(
      120deg,
      transparent 0%,
      rgba(255, 255, 255, 0.85) 50%,
      transparent 100%
    );
    transform: rotate(25deg);
    pointer-events: none;
    transition: left 0.8s ease;
  }

  .logo-white-card.sheen-active::after{
    left: 220%;
  }

  .logo-white-card img{
    height: 4.8cqw;
    max-width: 38cqw;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
  }

  /* ============ STEP 2: MULTI-LINE HOOK & CLEAN QUESTION PARAGRAPH ============ */
  .hook-stage-container{
    position: absolute;
    top: 15.0cqw;
    left: 4cqw;
    right: 4cqw;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 1.0cqw;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .hook-line{
    font-family: var(--font-hook);
    color: #ffffff;
    will-change: transform, opacity, filter;
  }

  .hook-title-line{
    font-weight: 900;
    font-size: 4.6cqw;
    line-height: 1.15;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95);
  }

  .hook-question-text{
    font-family: 'Outfit', 'Plus Jakarta Sans', var(--font-hook);
    font-weight: 800;
    font-size: 3.6cqw;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: #f8fafc;
    text-shadow: 0 3px 16px rgba(0, 0, 0, 0.95);
    text-align: center;
    text-wrap: balance;
    max-width: 86cqw;
    margin: 0 auto;
  }

  .hook-line.hook-slam{
    animation: hookSuperSlamIn 0.58s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes hookSuperSlamIn{
    0% {
      transform: scale(1.48) translateY(-4cqw) rotate(-1.5deg);
      opacity: 0;
      filter: blur(10px) drop-shadow(0 0 50px #facc15);
      letter-spacing: 0.08em;
    }
    40% {
      transform: scale(0.9) translateY(1.0cqw) rotate(0.6deg);
      opacity: 1;
      filter: blur(0px) drop-shadow(0 0 35px #facc15);
      letter-spacing: -0.01em;
    }
    65% {
      transform: scale(1.08) translateY(-0.4cqw) rotate(-0.2deg);
    }
    85% {
      transform: scale(0.98) translateY(0.1cqw);
    }
    100% {
      transform: scale(1.0) translateY(0) rotate(0deg);
      opacity: 1;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.95));
    }
  }

  .hook-line.hook-slam-line2{
    animation: hookLine2SuperSlamIn 0.58s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes hookLine2SuperSlamIn{
    0% {
      transform: scale(1.42) translateY(4cqw) rotate(1.5deg);
      opacity: 0;
      filter: blur(10px) drop-shadow(0 0 50px #ff007a);
      letter-spacing: 0.08em;
    }
    40% {
      transform: scale(0.9) translateY(-1.0cqw) rotate(-0.6deg);
      opacity: 1;
      filter: blur(0px) drop-shadow(0 0 35px #ff007a);
      letter-spacing: -0.01em;
    }
    65% {
      transform: scale(1.08) translateY(0.4cqw) rotate(0.2deg);
    }
    85% {
      transform: scale(0.98) translateY(-0.1cqw);
    }
    100% {
      transform: scale(1.0) translateY(0) rotate(0deg);
      opacity: 1;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.95));
    }
  }

  /* Radial shockwave pulse behind canvas at start */
  .canvas-shockwave{
    position: absolute;
    top: 22%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.4);
    width: 65cqw;
    height: 65cqw;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(250, 204, 21, 0.55) 0%, rgba(255, 0, 122, 0.3) 40%, transparent 70%);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    transition: opacity 0.5s ease, transform 0.65s cubic-bezier(0.1, 0.9, 0.2, 1);
  }
  .canvas-shockwave.active{
    opacity: 1;
    transform: translate(-50%, -50%) scale(2.0);
  }

  /* ============ STEP 3: CHRONOGRAPH STOPWATCH (90% Sizing) ============ */
  .clock-stage-container{
    position: absolute;
    top: 33.6cqw;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .chronograph-housing{
    position: relative;
    width: 18.5cqw;
    height: 18.5cqw;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .crown-main{
    position: absolute;
    top: -1.9cqw;
    left: 50%;
    transform: translateX(-50%);
    width: 3.8cqw;
    height: 1.8cqw;
    background: linear-gradient(90deg, #374151 0%, #9ca3af 35%, #f3f4f6 50%, #9ca3af 65%, #374151 100%);
    border-radius: 0.4cqw 0.4cqw 0 0;
    box-shadow: 0 -0.4cqw 0.8cqw rgba(0,0,0,0.6);
    z-index: 1;
  }

  .pusher-left{
    position: absolute;
    top: 0.5cqw; left: 0.9cqw;
    width: 1.6cqw; height: 2.6cqw;
    background: linear-gradient(135deg, #9ca3af, #374151);
    border-radius: 0.3cqw;
    transform: rotate(-38deg);
    z-index: 1;
  }
  .pusher-right{
    position: absolute;
    top: 0.5cqw; right: 0.9cqw;
    width: 1.6cqw; height: 2.6cqw;
    background: linear-gradient(225deg, #9ca3af, #374151);
    border-radius: 0.3cqw;
    transform: rotate(38deg);
    z-index: 1;
  }

  .bezel-outer-ring{
    position: relative;
    width: 17.5cqw;
    height: 17.5cqw;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #2d3748, #4a5568, #1a202c, #4a5568, #2d3748);
    border: 0.4cqw solid #1e293b;
    box-shadow: 
      0 2cqw 6cqw rgba(0, 0, 0, 0.95),
      0 0 0 0.3cqw rgba(255, 255, 255, 0.2),
      0 0 30px rgba(0, 240, 255, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .bezel-inner-ring{
    position: relative;
    width: 15.0cqw;
    height: 15.0cqw;
    border-radius: 50%;
    background: #090c14;
    border: 0.3cqw solid #334155;
    box-shadow: inset 0 0 1.5cqw rgba(0, 0, 0, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .watch-svg-layer{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
  }
  .watch-svg-layer svg{
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .tick-major{ stroke: rgba(255, 255, 255, 0.45); stroke-width: 2.5; stroke-linecap: round; }
  .tick-minor{ stroke: rgba(255, 255, 255, 0.18); stroke-width: 1.2; stroke-linecap: round; }

  .radial-track-path{ fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-width: 5; }
  .radial-progress-path{
    fill: none;
    stroke: var(--cyan);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 276.46;
    stroke-dashoffset: 0;
    filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.9));
    transition: stroke 0.2s linear;
  }
  .radial-progress-path.hot{
    stroke: var(--pink);
    filter: drop-shadow(0 0 10px rgba(255, 0, 122, 1));
  }

  .chronograph-needle{
    position: absolute;
    top: 50%; left: 50%;
    width: 0.4cqw; height: 6.0cqw;
    background: linear-gradient(180deg, var(--pink), #ff4770);
    border-radius: 2px;
    transform-origin: bottom center;
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow: 0 0 8px rgba(255, 0, 122, 0.9);
    z-index: 6;
  }

  .needle-pivot-screw{
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 1.5cqw; height: 1.5cqw;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 30%, #9ca3af 70%, #374151 100%);
    border: 0.3cqw solid var(--pink);
    z-index: 7;
  }

  .dial-digital-cluster{
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    margin-top: -0.8cqw;
  }
  .digital-time-num{
    font-size: 6.0cqw;
    font-weight: 900;
    line-height: 1;
    color: #ffffff;
    text-shadow: 0 0 16px rgba(0, 240, 255, 0.85);
    letter-spacing: -0.03em;
  }
  .digital-time-num.hot{ text-shadow: 0 0 20px rgba(255, 0, 122, 0.95); }
  .digital-time-unit{
    font-size: 1.3cqw;
    font-weight: 800;
    letter-spacing: 0.18em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-top: 0.2cqw;
  }
  .digital-time-unit.hot{ color: var(--pink); }

  /* ============ STEP 4 & 5: DYNAMIC CODE CELLS + ATTACHED POLL CTA ============ */
  .options-stage-container{
    position: absolute;
    left: 4.2cqw;
    right: 4.2cqw;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 2.0cqw;
    transition: top 0.6s cubic-bezier(0.34, 1.25, 0.64, 1), opacity 0.4s ease;
  }

  .ide-code-cell{
    position: relative;
    border-radius: 2.6cqw;
    background: 
      radial-gradient(100% 100% at 0% 0%, rgba(255,255,255,0.03) 0%, transparent 100%),
      #080a10;
    border: 1.5px solid rgba(255, 255, 255, 0.09);
    box-shadow: 
      0 2cqw 5cqw rgba(0, 0, 0, 0.95),
      inset 0 1px 1px rgba(255, 255, 255, 0.12);
    overflow: hidden;
    cursor: pointer;
    backdrop-filter: blur(16px);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease, opacity 0.35s ease, border-color 0.35s ease;
  }

  .ide-code-cell::before{
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    background-size: 3cqw 3cqw;
    pointer-events: none;
    z-index: 1;
  }

  /* Normal Ambient Styles */
  .ide-code-cell.cell-a{
    border-color: rgba(0, 245, 155, 0.48);
    box-shadow: 0 1.8cqw 4.5cqw rgba(0, 0, 0, 0.95), 0 0 24px rgba(0, 245, 155, 0.2), inset 0 1.5px 0 rgba(0, 245, 155, 0.6);
  }
  .ide-code-cell.cell-b{
    border-color: rgba(168, 85, 247, 0.48);
    box-shadow: 0 1.8cqw 4.5cqw rgba(0, 0, 0, 0.95), 0 0 24px rgba(168, 85, 247, 0.2), inset 0 1.5px 0 rgba(168, 85, 247, 0.6);
  }

  /* Active Spotlight Highlighting with Dramatic 3D Zoom Pop */
  .ide-code-cell.spotlight-active.cell-a{
    transform: scale(1.048) translateY(-0.6cqw) !important;
    border-color: #00f59b !important;
    box-shadow: 0 2.5cqw 6cqw rgba(0, 0, 0, 0.98), 0 0 48px rgba(0, 245, 155, 0.85), inset 0 2px 0 rgba(0, 245, 155, 0.9) !important;
    z-index: 20 !important;
    opacity: 1 !important;
  }

  .ide-code-cell.spotlight-active.cell-b{
    transform: scale(1.048) translateY(0.6cqw) !important;
    border-color: #c084fc !important;
    box-shadow: 0 2.5cqw 6cqw rgba(0, 0, 0, 0.98), 0 0 48px rgba(168, 85, 247, 0.85), inset 0 2px 0 rgba(168, 85, 247, 0.9) !important;
    z-index: 20 !important;
    opacity: 1 !important;
  }

  .ide-code-cell.spotlight-dimmed{
    opacity: 0.42 !important;
    transform: scale(0.96) !important;
  }

  .ide-tab-bar{
    height: 5.8cqw;
    background: linear-gradient(180deg, #131926 0%, #0c101a 100%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    padding: 0 2.2cqw;
    position: relative;
    z-index: 5;
  }

  .ide-tab-left{ display: flex; align-items: center; }
  .ide-tab-center{ display: flex; align-items: center; justify-content: center; }
  .ide-tab-right{ display: flex; align-items: center; justify-content: flex-end; }

  /* 3D Tactile Hero Badges */
  .hero-choice-badge{
    width: 7.8cqw;
    height: 4.4cqw;
    border-radius: 1.2cqw;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', 'Outfit', sans-serif;
    font-size: 3.6cqw;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }

  .badge-a{
    background: linear-gradient(145deg, #00f59b 0%, #059669 100%);
    color: #02140b;
    border: 1.8px solid #a7f3d0;
    box-shadow: 0 0 22px rgba(0, 245, 155, 0.9), 0 3px 8px rgba(0, 0, 0, 0.8), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.95);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
  }

  .badge-b{
    background: linear-gradient(145deg, #c084fc 0%, #7c3aed 100%);
    color: #110222;
    border: 1.8px solid #f3e8ff;
    box-shadow: 0 0 22px rgba(168, 85, 247, 0.9), 0 3px 8px rgba(0, 0, 0, 0.8), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.95);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
  }

  .ide-tab-pill{
    display: inline-flex;
    align-items: center;
    gap: 1cqw;
    background: #080a10;
    padding: 0.5cqw 2.0cqw;
    border-radius: 1.2cqw 1.2cqw 0 0;
    border-bottom: none;
    font-family: var(--font-code);
    font-size: 2.3cqw;
    font-weight: 800;
    letter-spacing: 0.02em;
    box-shadow: 0 -2px 6px rgba(0,0,0,0.5);
  }
  .tab-pill-a{ border: 1px solid rgba(0, 245, 155, 0.25); color: #6ee7b7; }
  .tab-pill-b{ border: 1px solid rgba(168, 85, 247, 0.25); color: #e9d5ff; }
  .ide-tab-pill .tab-icon{ font-size: 2.2cqw; }

  .ide-window-dots{ display: flex; gap: 0.8cqw; align-items: center; }
  .ide-window-dots span{
    width: 1.2cqw; height: 1.2cqw;
    border-radius: 50%; display: block;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.6);
  }
  .dot-red{ background: linear-gradient(135deg, #ff5f56, #e0443e); }
  .dot-yellow{ background: linear-gradient(135deg, #ffbd2e, #dea123); }
  .dot-green{ background: linear-gradient(135deg, #27c93f, #1aab29); }

  .ide-editor-body{
    display: flex;
    padding: 1.2cqw 0;
    background: transparent;
    position: relative;
    z-index: 2;
  }

  .ide-gutter{
    width: 6.2cqw;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    padding-right: 1.6cqw;
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    font-family: var(--font-code);
    font-size: 2.55cqw;
    line-height: 1.36;
    color: #4b5563;
    user-select: none;
    font-weight: 700;
  }

  .ide-code-content{
    flex: 1;
    padding-left: 2.0cqw;
    padding-right: 2.2cqw;
    font-family: var(--font-code);
    font-size: 2.68cqw;
    line-height: 1.36;
    white-space: pre-wrap;
    word-break: break-word;
    color: #f8fafc;
    letter-spacing: 0.015em;

const TOTAL_MS = 15500;
const CIRCUMFERENCE = 2 * Math.PI * 44; // ~276.46

let currentData = {
  reelNo: 'SQL-01-R1',
  day: 'DAY 01',
  lang: 'sql',
  hook: "90% FAIL THIS SQL TRAP 💀\nRETURN 0-ROWS ?",
  hookLineObjects: [
    { text: '90% FAIL THIS SQL TRAP 💀', font: 'Plus Jakarta Sans', size: 6.3 },
    { text: 'RETURN 0-ROWS ?', font: 'Outfit', size: 5.5 }
  ],
  hookHighlights: [
    { text: '90%', color: '#facc15' },
    { text: '0-ROWS', color: '#00f0ff' }
  ],
  codeA: 'SELECT *\nFROM employees\nWHERE dept_id NOT IN (\n  SELECT dept_id\n  FROM departments\n)',
  codeB: 'SELECT *\nFROM employees\nWHERE dept_id NOT IN (\n  SELECT dept_id\n  FROM departments\n  WHERE dept_id IS NOT NULL\n)',
  pollInstr: 'DROP YOUR VOTE IN COMMENTS 👇',
  hookFont: 'Plus Jakarta Sans',
  codeFont: 'JetBrains Mono',
  pollFont: 'Plus Jakarta Sans',
  badgeFont: 'Plus Jakarta Sans'
};

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* Syntax Highlighter */
function highlightCode(raw, lang, isCardB){
  if(!raw) return '';
  let s = escapeHtml(raw);
  const tokens = [];
  const l = (lang||'').toLowerCase();

  // 1. Comments
  if(l === 'python'){
    s = s.replace(/(#.*$)/gm, m => {
      const id = `___TOKCOM${tokens.length}___`;
      tokens.push({ id, html: `<span class="syn-com">${m}</span>` });
      return id;
    });
  } else if(l === 'sql'){
    s = s.replace(/(--.*$)/gm, m => {
      const id = `___TOKCOM${tokens.length}___`;
      tokens.push({ id, html: `<span class="syn-com">${m}</span>` });
      return id;
    });
  }

  // 2. Strings
  s = s.replace(/(['"])(?:\\.|(?!\1).)*\1/g, m => {
    const id = `___TOKSTR${tokens.length}___`;
    tokens.push({ id, html: `<span class="syn-str">${m}</span>` });
    return id;
  });

  // 3. Language Keywords & Traps
  if(l === 'python'){
    s = s.replace(/\b(def|return|if|elif|else|for|while|in|import|from|class|try|except|with|as|pass|lambda|yield)\b/g, '<span class="syn-kw">$1</span>');
    s = s.replace(/\b(None|True|False)\b/g, isCardB ? '<span class="syn-trap-b">$1</span>' : '<span class="syn-trap-a">$1</span>');
    s = s.replace(/\b(print|len|range|enumerate|zip|map|filter|int|str|float|list|dict|set)\b/g, '<span class="syn-func">$1</span>');
    s = s.replace(/\b(\d+)\b/g, '<span class="syn-num">$1</span>');
  } else if(l === 'excel'){
    s = s.replace(/\b(VLOOKUP|XLOOKUP|INDEX|MATCH|HLOOKUP|LOOKUP|OFFSET|INDIRECT|FILTER|UNIQUE|SORT|TRANSPOSE)\b/gi, '<span class="syn-kw">$1</span>');
    s = s.replace(/\b(IF|IFS|SWITCH|AND|OR|NOT|XOR|ISERROR|ISNA|IFERROR|IFNA)\b/gi, isCardB ? '<span class="syn-trap-b">$1</span>' : '<span class="syn-trap-a">$1</span>');
    s = s.replace(/\b(SUM|SUMIFS|COUNT|COUNTIFS|AVERAGE|AVERAGEIFS|MIN|MAX|CONCAT|TEXTJOIN|LEFT|RIGHT|MID|LEN)\b/gi, '<span class="syn-func">$1</span>');
    s = s.replace(/\b(TRUE|FALSE|NA|N\/A|REF!|VALUE!|DIV\/0!)\b/gi, isCardB ? '<span class="syn-trap-b">$1</span>' : '<span class="syn-trap-a">$1</span>');
    s = s.replace(/\b(\$?[A-Z]+\$?[0-9]+(?::\$?[A-Z]+\$?[0-9]+)?)\b/g, '<span class="syn-num">$1</span>');
    s = s.replace(/(=)/g, '<span class="syn-kw">$1</span>');
  } else {
    const trapClass = isCardB ? 'syn-trap-b' : 'syn-trap-a';
    s = s.replace(/\b(NOT IN|NOT EXISTS|IS NOT NULL|IS NULL|IS NOT|IS|NULL|DENSE_RANK|RANK|ROWS UNBOUNDED PRECEDING|ROWS|RANGE|UNBOUNDED PRECEDING|CURRENT ROW)\b/gi, `<span class="${trapClass}">$1</span>`);
    s = s.replace(/\b(SELECT|FROM|WHERE|INSERT|INTO|UPDATE|DELETE|GROUP BY|ORDER BY|HAVING|LIMIT|LEFT JOIN|RIGHT JOIN|INNER JOIN|FULL JOIN|JOIN|ON|AS|UNION ALL|UNION|DISTINCT|CASE|WHEN|THEN|END|AND|OR|NOT|IN|EXISTS|BETWEEN|LIKE|ILIKE|DESC|ASC|OVER|PARTITION BY|PRECEDING|FOLLOWING)\b/gi, '<span class="syn-kw">$1</span>');
    s = s.replace(/\b(COUNT|SUM|AVG|MIN|MAX|COALESCE|NULLIF|ROW_NUMBER|LEAD|LAG)\b/gi, '<span class="syn-func">$1</span>');
    s = s.replace(/\b(TRUE|FALSE)\b/gi, `<span class="${trapClass}">$1</span>`);
    s = s.replace(/\b(\d+)\b/g, '<span class="syn-num">$1</span>');
  }

  // 4. Restore tokens
  tokens.forEach(tok => {
    s = s.replace(tok.id, tok.html);
  });

  return s;
}

function renderHook(){
  const hookStage = document.getElementById('hookStage');
  if(!hookStage) return;

  let lines = [];
  if(Array.isArray(currentData.hookLineObjects) && currentData.hookLineObjects.length > 0){
    lines = currentData.hookLineObjects;
  } else {
    const rawText = currentData.hook || '';
    lines = rawText.split('\n').filter(l => l.trim().length > 0).map((l, i) => ({ 
      text: l, 
      font: i === 0 ? (currentData.hookFont || 'Plus Jakarta Sans') : 'Outfit', 
      size: i === 0 ? 5.4 : 4.3 
    }));
  }

  if(lines.length === 0) lines.push({ text: 'YOUR HOOK GOES HERE', font: 'Plus Jakarta Sans', size: 5.4 });

  hookStage.innerHTML = lines.map((lineObj, idx) => {
    const lineText = typeof lineObj === 'string' ? lineObj : (lineObj.text || '');
    const lineFont = (typeof lineObj === 'object' && lineObj.font) ? lineObj.font : (idx === 0 ? (currentData.hookFont || 'Plus Jakarta Sans') : 'Outfit');
    const lineSize = (typeof lineObj === 'object' && lineObj.size) ? lineObj.size : (idx === 0 ? 5.4 : 4.3);
    const isQuestion = idx >= 1;

    let text = escapeHtml(lineText);
    (currentData.hookHighlights || []).forEach((item, i) => {
      const term = typeof item === 'string' ? item : item.text;
      const color = typeof item === 'object' && item.color ? item.color : (i % 2 === 0 ? '#facc15' : '#00f0ff');
      if(!term) return;
      const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      text = text.replace(re, `<span style="color:${color}; text-shadow:0 0 22px ${color}bb; font-weight:900;">$1</span>`);
    });
    
    const cls = isQuestion ? 'hook-line hook-question-text' : 'hook-line hook-title-line';
    return `<div class="${cls}" id="hookLine_${idx}" style="font-family:'${lineFont}', sans-serif; font-size:${lineSize}cqw;">${text}</div>`;
  }).join('');
}

function setClock(secRemaining, maxSec = 10){
  const progEl = document.getElementById('clockProgress');
  const numEl = document.getElementById('clockNum');
  const unitEl = document.getElementById('clockUnit');
  const needleEl = document.getElementById('clockNeedle');
  if(!progEl || !numEl) return;

  const clamped = Math.max(0, Math.min(maxSec, secRemaining));
  const pct = clamped / maxSec;
  const offset = CIRCUMFERENCE * (1 - pct);
  progEl.style.strokeDashoffset = offset.toFixed(2);

  const isHot = clamped <= 3.0;
  progEl.classList.toggle('hot', isHot);
  numEl.classList.toggle('hot', isHot);
  if(unitEl) unitEl.classList.toggle('hot', isHot);

  const wholeSec = Math.ceil(clamped);
  numEl.textContent = wholeSec;

  if(needleEl){
    const deg = (1 - pct) * 360;
    needleEl.style.transform = `translate(-50%, -100%) rotate(${deg}deg)`;
  }
}

function buildCCTimeline(){
  const cues = getCues();

  // If server provided pre-computed exact Whisper / Edge-TTS boundary cues, use them directly!
  if(cues.phrases && Array.isArray(cues.phrases) && cues.phrases.length > 0){
    return cues.phrases;
  }

  // Use Ground-Truth Whisper timing for default reel
  if(!currentData.voiceScript || currentData.voiceScript.includes('Ninety percent fail')){
    return WHISPER_GROUND_TRUTH;
  }

  const script = (currentData.voiceScript || '').trim();
  let phrases = [];

  const line1Text = (currentData.hookLineObjects && currentData.hookLineObjects[0]) ? currentData.hookLineObjects[0].text : 'Ninety percent fail this SQL trap.';
  const line2Text = (currentData.hookLineObjects && currentData.hookLineObjects[1]) ? currentData.hookLineObjects[1].text : 'One of these silently returns zero rows.';
  const ctaText = currentData.pollInstr || 'Comment your answer with reason below.';

  // Granular synchronization matching exact voice cues
  phrases = [
    { index: 0, text: line1Text, startMs: 0, endMs: cues.t_line2_start },
    { index: 1, text: line2Text, startMs: cues.t_line2_start, endMs: Math.max(cues.t_line2_start + 500, cues.t_clock_in - 50) },
    { index: 2, text: "Choose your answer... Option A or Option B?", startMs: cues.t_clock_in, endMs: Math.min(cues.t_clock_out, cues.t_optb + 1400) },
    { index: 3, text: ctaText, startMs: cues.t_cta_start, endMs: cues.totalMs }
  ];

  // Tokenize each phrase into word tokens with proportional syllable/character weighting
  const timeline = [];
  phrases.forEach((ph)=>{
    const rawWords = ph.text.replace(/[\n\r]+/g, ' ').replace(/[^\w\s\$\%\?\"\'-]/g, '').split(/\s+/).filter(Boolean);
    if(!rawWords.length) return;

    const totalDur = Math.max(200, ph.endMs - ph.startMs);
    const weights = rawWords.map(w => {
      const cleanLen = w.replace(/[^\w]/g, '').length;
      let wt = Math.max(1.5, cleanLen * 1.0);
      if(/[.,!?:;]$/.test(w)) wt += 1.2;
      return wt;
    });
    const totalWeight = weights.reduce((a, b) => a + b, 0) || 1.0;
    let curTime = ph.startMs;

    const words = rawWords.map((w, wIdx)=>{
      const wDur = (weights[wIdx] / totalWeight) * totalDur;
      const wStart = curTime;
      const wEnd = curTime + wDur;
      curTime = wEnd;
      return { word: w, startMs: wStart, endMs: wEnd, index: wIdx };
    });

    timeline.push({
      index: ph.index,
      phrase: ph.text,
      startMs: ph.startMs,
      endMs: ph.endMs,
      words: words
    });
  });

  return timeline;
}

function renderCC(elapsedMs){
  const ccStage = document.getElementById('ccStage');
  const ccWrapper = document.getElementById('ccWordsWrapper');
  const ccPill = document.getElementById('ccPill');
  if(!ccStage || !ccWrapper) return;

  const isEnabled = currentData.ccEnabled !== false;
  if(!isEnabled){
    ccStage.style.display = 'none';
    return;
  }

  // Apply theme styling
  const styleTheme = currentData.ccStyle || 'hormozi';
  if(ccPill){
    ccPill.className = 'cc-pill cc-style-' + styleTheme;
  }

  const cues = getCues();
  const t_voice_end = cues.t_voice_end || 15950;

  if(!cachedCCTimeline){
    cachedCCTimeline = buildCCTimeline();
  }

  // 1. Word highlight tracking
  const activePhrase = cachedCCTimeline.find(p => elapsedMs >= p.startMs && elapsedMs < p.endMs);
  if(activePhrase){
    ccStage.style.display = 'flex';
    ccStage.style.opacity = '1';
    ccStage.style.transform = 'translateY(0) scale(1.0)';
    ccStage.classList.add('visible');

    // If new phrase, rebuild DOM
    if(lastRenderedPhraseIdx !== activePhrase.index){
      lastRenderedPhraseIdx = activePhrase.index;
      ccWrapper.innerHTML = activePhrase.words.map((w, i)=> `<span class="cc-word" id="ccW_${i}">${w.word}</span>`).join(' ');
    }

    // Update active & completed word states
    activePhrase.words.forEach((w, i)=>{
      const el = document.getElementById('ccW_' + i);
      if(!el) return;
      if(elapsedMs >= w.startMs && elapsedMs < w.endMs){
        el.className = 'cc-word active';
      } else if(elapsedMs >= w.endMs){
        el.className = 'cc-word completed';
      } else {
        el.className = 'cc-word';
      }
    });
  } else {
    if(elapsedMs < t_voice_end){
      ccStage.style.opacity = '0';
      ccStage.style.transform = 'translateY(1.0cqw) scale(0.96)';
      ccStage.classList.remove('visible');
    }
  }

  // 2. End of speech: Smooth CC Fade-out & Clean Poll CTA Presentation
  const pollStage = document.getElementById('pollStage');
  if(pollStage && elapsedMs >= cues.t_clock_out){
    const glideDuration = 450; // ms for buttery smooth cubic ease fade
    if(elapsedMs < t_voice_end){
      // During CTA speech: CC visible, Poll normal
      ccStage.style.opacity = '1';
      ccStage.style.transform = 'translateY(0) scale(1.0)';
      ccStage.style.display = 'flex';
      pollStage.style.transform = 'translateY(0) scale(1.0)';
    } else if(elapsedMs >= t_voice_end && elapsedMs < t_voice_end + glideDuration){
      // Transition window: CC smoothly fades out & shrinks, Poll stays cleanly below code card
      const p = (elapsedMs - t_voice_end) / glideDuration;
      const ease = p * p * (3 - 2 * p); // smooth cubic ease

      ccStage.style.opacity = (1.0 - ease).toFixed(2);
      ccStage.style.transform = `scale(${(1.0 - 0.15 * ease).toFixed(3)}) translateY(${(-2.0 * ease).toFixed(2)}cqw)`;
      ccStage.style.display = 'flex';

      pollStage.style.transform = 'translateY(0) scale(1.0)';
    } else {
      // 1.5s Hold at end: CC is completely hidden, Poll is cleanly positioned below Card B
      ccStage.style.opacity = '0';
      ccStage.style.transform = 'scale(0.85) translateY(-2cqw)';
      ccStage.style.display = 'none';

      pollStage.style.transform = 'translateY(0) scale(1.0)';
    }
  }
}

function computeLogoFrameAnim(elapsedMs){
  const logoCard = document.getElementById('logoCard');
  if(!logoCard) return;

  if(elapsedMs < 700){
    const t = Math.max(0, elapsedMs) / 700.0;
    let scale, ty, op, blur;
    if(t < 0.45){
      const p = t / 0.45;
      // Spring shoot up from 0.2 to 1.25
      const easeOut = Math.sin(p * Math.PI / 2);
      scale = 0.2 + (1.25 - 0.2) * easeOut;
      ty = -6.0 + (1.5 - (-6.0)) * p;
      op = Math.min(1.0, p * 2.8);
      blur = Math.max(0, 8 * (1 - p));
    } else if(t < 0.70){
      const p = (t - 0.45) / 0.25;
      scale = 1.25 - (1.25 - 0.92) * p;
      ty = 1.5 - (1.5 - (-0.6)) * p;
      op = 1.0; blur = 0;
    } else if(t < 0.85){
      const p = (t - 0.70) / 0.15;
      scale = 0.92 + (1.05 - 0.92) * p;
      ty = -0.6 + (0.2 - (-0.6)) * p;
      op = 1.0; blur = 0;
    } else {
      const p = (t - 0.85) / 0.15;
      scale = 1.05 - (1.05 - 1.0) * p;
      ty = 0.2 - 0.2 * p;
      op = 1.0; blur = 0;
    }

    logoCard.style.transform = `translateY(${ty.toFixed(2)}cqw) scale(${scale.toFixed(3)})`;
    logoCard.style.opacity = op.toFixed(2);
    logoCard.style.filter = blur > 0.1 ? `blur(${blur.toFixed(1)}px) drop-shadow(0 0 45px rgba(0, 240, 255, 0.95))` : 'drop-shadow(0 1.5cqw 4.5cqw rgba(0, 0, 0, 0.7)) drop-shadow(0 0 25px rgba(0, 240, 255, 0.35))';
    logoCard.classList.toggle('sheen-active', elapsedMs > 250);
  } else {
    logoCard.style.transform = 'translateY(0) scale(1)';
    logoCard.style.opacity = '1';
    logoCard.style.filter = 'drop-shadow(0 1.5cqw 4.5cqw rgba(0, 0, 0, 0.7)) drop-shadow(0 0 25px rgba(0, 240, 255, 0.35))';
    logoCard.classList.toggle('sheen-active', elapsedMs > 250);
  }
}

function computeOptionsAndClockStage(elapsedMs, cues){
  const clockStage = document.getElementById('clockStage');
  const optionsStage = document.getElementById('optionsStage');
  if(!optionsStage) return;

  const topUpper = 33.2; // cqw (Generous 3.4cqw clearance below Question text)
  const topLower = 55.2; // cqw (Generous 3.1cqw clearance below 90% Stopwatch)
  const glideDuration = 450; // ms for buttery smooth glide transition

  // 1. Before Question is Narrated (0 -> t_line2_start): Code cells hidden below
  if(elapsedMs < cues.t_line2_start){
    if(clockStage){
      clockStage.style.opacity = '0';
      clockStage.style.transform = 'scale(0.4) translateY(4cqw)';
      clockStage.style.pointerEvents = 'none';
    }
    optionsStage.style.top = `${topUpper.toFixed(2)}cqw`;
    optionsStage.style.opacity = '0';
    optionsStage.style.transform = 'translateY(3.5cqw) scale(0.94)';
  }
  // 2. Question Narration Begins (t_line2_start -> t_line2_start + glideDuration): Smooth spring reveal of code cells!
  else if(elapsedMs >= cues.t_line2_start && elapsedMs < cues.t_line2_start + glideDuration && elapsedMs < cues.t_clock_in){
    const p = (elapsedMs - cues.t_line2_start) / glideDuration;
    const ease = Math.sin(p * Math.PI / 2);
    const ty = 3.5 * (1 - ease);
    const scale = 0.94 + (1.0 - 0.94) * ease;
    optionsStage.style.top = `${topUpper.toFixed(2)}cqw`;
    optionsStage.style.opacity = Math.min(1.0, p * 2.5).toFixed(2);
    optionsStage.style.transform = `translateY(${ty.toFixed(2)}cqw) scale(${scale.toFixed(3)})`;
  }
  // 3. Steady State before clock enters (t_line2_start + glideDuration -> t_clock_in)
  else if(elapsedMs >= cues.t_line2_start + glideDuration && elapsedMs < cues.t_clock_in){
    if(clockStage){
      clockStage.style.opacity = '0';
      clockStage.style.transform = 'scale(0.4) translateY(4cqw)';
      clockStage.style.pointerEvents = 'none';
    }
    optionsStage.style.top = `${topUpper.toFixed(2)}cqw`;
    optionsStage.style.opacity = '1';
    optionsStage.style.transform = 'translateY(0) scale(1)';
  }
  // 4. Clock Entry Glide Down (t_clock_in -> t_clock_in + glideDuration)
  else if(elapsedMs >= cues.t_clock_in && elapsedMs < cues.t_clock_in + glideDuration){
    const p = (elapsedMs - cues.t_clock_in) / glideDuration;
    // Smooth cubic bezier easeInOut: 3p^2 - 2p^3
    const ease = p * p * (3 - 2 * p);
    const curTop = topUpper + (topLower - topUpper) * ease;
    optionsStage.style.top = `${curTop.toFixed(2)}cqw`;
    optionsStage.style.opacity = '1';
    optionsStage.style.transform = 'translateY(0) scale(1)';

    if(clockStage){
      const scale = 0.4 + (1.0 - 0.4) * ease;
      const ty = 3.0 * (1 - ease);
      clockStage.style.opacity = ease.toFixed(2);
      clockStage.style.transform = `scale(${scale.toFixed(3)}) translateY(${ty.toFixed(2)}cqw)`;
      clockStage.style.pointerEvents = 'auto';
    }
  }
  // 5. Clock Active Steady State (t_clock_in + glideDuration -> t_clock_out)
  else if(elapsedMs >= cues.t_clock_in + glideDuration && elapsedMs < cues.t_clock_out){
    optionsStage.style.top = `${topLower.toFixed(2)}cqw`;
    optionsStage.style.opacity = '1';
    optionsStage.style.transform = 'translateY(0) scale(1)';

    if(clockStage){
      clockStage.style.opacity = '1';
      clockStage.style.transform = 'scale(1.0) translateY(0)';
      clockStage.style.pointerEvents = 'auto';
    }
  }
  // 6. Clock Exit Glide Up (t_clock_out -> t_clock_out + glideDuration)
  else if(elapsedMs >= cues.t_clock_out && elapsedMs < cues.t_clock_out + glideDuration){
    const p = (elapsedMs - cues.t_clock_out) / glideDuration;
    const ease = p * p * (3 - 2 * p);
    const curTop = topLower - (topLower - topUpper) * ease;
    optionsStage.style.top = `${curTop.toFixed(2)}cqw`;
    optionsStage.style.opacity = '1';
    optionsStage.style.transform = 'translateY(0) scale(1)';

    if(clockStage){
      const scale = 1.0 - (1.0 - 0.4) * ease;
      const ty = -3.0 * ease;
      clockStage.style.opacity = (1.0 - ease).toFixed(2);
      clockStage.style.transform = `scale(${scale.toFixed(3)}) translateY(${ty.toFixed(2)}cqw)`;
      clockStage.style.pointerEvents = 'none';
    }
  }
  // 7. Post-Clock Steady State (t_clock_out + glideDuration -> totalMs)
  else {
    optionsStage.style.top = `${topUpper.toFixed(2)}cqw`;
    optionsStage.style.opacity = '1';
    optionsStage.style.transform = 'translateY(0) scale(1)';

    if(clockStage){
      clockStage.style.opacity = '0';
      clockStage.style.transform = 'scale(0.4) translateY(-4cqw)';
      clockStage.style.pointerEvents = 'none';
    }
  }
}

function computeCardSpotlights(elapsedMs, cues){
  const cardA = document.getElementById('cardA');
  const cardB = document.getElementById('cardB');
  if(!cardA || !cardB) return;
  if(elapsedMs < cues.t_line2_start) return;

  const tA = cues.t_opta;
  const tB = cues.t_optb;
  const tBEnd = cues.t_optb_end || (tB + 1200);
  const fadeDur = 180; // ms for ultra-smooth cubic bezier interpolation
  const recoverDur = 240; // ms to return both cards to steady 100% full view

  let scaleA = 1.0, tyA = 0, opA = 1.0, glowA = 0;
  let scaleB = 1.0, tyB = 0, opB = 1.0, glowB = 0;

  // 1. Before Option A
  if(elapsedMs < tA){
    scaleA = 1.0; tyA = 0; opA = 1.0; glowA = 0;
    scaleB = 1.0; tyB = 0; opB = 1.0; glowB = 0;
  }
  // 2. Option A Spotlight
  else if(elapsedMs >= tA && elapsedMs < tB){
    if(!spotlightATriggered){
      spotlightATriggered = true;
      playSpotlightA();
    }
    const p = Math.min(1.0, (elapsedMs - tA) / fadeDur);
    const ease = 1 - Math.pow(1 - p, 3);

    scaleA = 1.0 + (1.048 - 1.0) * ease;
    tyA = -0.6 * ease;
    opA = 1.0;
    glowA = ease;

    scaleB = 1.0 - (1.0 - 0.96) * ease;
    opB = 1.0 - (1.0 - 0.42) * ease;
  }
  // 3. Option B Spotlight
  else if(elapsedMs >= tB && elapsedMs < tBEnd){
    if(!spotlightBTriggered){
      spotlightBTriggered = true;
      playSpotlightB();
    }
    const p = Math.min(1.0, (elapsedMs - tB) / fadeDur);
    const ease = 1 - Math.pow(1 - p, 3);

    scaleA = 1.048 - (1.048 - 0.96) * ease;
    tyA = -0.6 * (1 - ease);
    opA = 1.0 - (1.0 - 0.42) * ease;

    scaleB = 0.96 + (1.048 - 0.96) * ease;
    tyB = 0.6 * ease;
    opB = 0.42 + (1.0 - 0.42) * ease;
    glowB = ease;
  }
  // 4. Smooth Recovery after Option B finishes (Both cards gracefully return to 100% full view)
  else if(elapsedMs >= tBEnd && elapsedMs < tBEnd + recoverDur){
    const p = Math.min(1.0, (elapsedMs - tBEnd) / recoverDur);
    const ease = 1 - Math.pow(1 - p, 3); // smooth cubic ease out

    scaleA = 0.96 + (1.0 - 0.96) * ease;
    tyA = 0;
    opA = 0.42 + (1.0 - 0.42) * ease;

    scaleB = 1.048 - (1.048 - 1.0) * ease;
    tyB = 0.6 * (1 - ease);
    opB = 1.0;
    glowB = 1 - ease;
  }
  // 5. Rest of timeline (both cards steady at 100% full view)
  else {
    scaleA = 1.0; tyA = 0; opA = 1.0; glowA = 0;
    scaleB = 1.0; tyB = 0; opB = 1.0; glowB = 0;
  }

  cardA.style.transform = `scale(${scaleA.toFixed(3)}) translateY(${tyA.toFixed(2)}cqw)`;
  cardA.style.opacity = opA.toFixed(3);
  cardA.style.zIndex = glowA > 0.1 ? '20' : '2';
  if(glowA > 0.02){
    cardA.style.borderColor = `rgba(0, 245, 155, ${(0.48 + 0.52 * glowA).toFixed(2)})`;
    cardA.style.boxShadow = `0 2.5cqw 6cqw rgba(0, 0, 0, 0.98), 0 0 ${(24 + 24 * glowA).toFixed(0)}px rgba(0, 245, 155, ${(0.2 + 0.65 * glowA).toFixed(2)}), inset 0 2px 0 rgba(0, 245, 155, 0.9)`;
  } else {
    cardA.style.borderColor = '';
    cardA.style.boxShadow = '';
  }

  cardB.style.transform = `scale(${scaleB.toFixed(3)}) translateY(${tyB.toFixed(2)}cqw)`;
  cardB.style.opacity = opB.toFixed(3);
  cardB.style.zIndex = glowB > 0.1 ? '20' : '2';
  if(glowB > 0.02){
    cardB.style.borderColor = `rgba(192, 132, 252, ${(0.48 + 0.52 * glowB).toFixed(2)})`;
    cardB.style.boxShadow = `0 2.5cqw 6cqw rgba(0, 0, 0, 0.98), 0 0 ${(24 + 24 * glowB).toFixed(0)}px rgba(168, 85, 247, ${(0.2 + 0.65 * glowB).toFixed(2)}), inset 0 2px 0 rgba(168, 85, 247, 0.9)`;
  } else {
    cardB.style.borderColor = '';
    cardB.style.boxShadow = '';
  }
}

// 1.05 CINEMATIC KINETIC 7-LAYER COMPONENT ANIMATION
function computeLayeredPosterAnim(elapsedMs, posterDur, tGlitch) {
  const pTitle = document.getElementById('posterTitle');
  const pTape = document.getElementById('posterTape');
  const pCardLeft = document.getElementById('posterCardLeft');
  const pCardRight = document.getElementById('posterCardRight');
  const pVs = document.getElementById('posterVsLightning');
  const pBottom = document.getElementById('posterBottom');
  const pBg = document.getElementById('posterBg');

  if(!pTitle) return;

  // Frame 0 thumbnail safeguard: at exactly 0ms, everything is 100% resting and assembled
  if(elapsedMs <= 0) {
    pTitle.style.transform = 'none'; pTitle.style.opacity = '1';
    pTape.style.transform = 'none'; pTape.style.opacity = '1';
    pCardLeft.style.transform = 'none'; pCardLeft.style.opacity = '1';
    pCardRight.style.transform = 'none'; pCardRight.style.opacity = '1';
    pVs.style.transform = 'none'; pVs.style.opacity = '1'; pVs.style.filter = 'none';
    pBottom.style.transform = 'none'; pBottom.style.opacity = '1';
    if(pBg) pBg.style.opacity = '1';
    return;
  }

  // --- KINETIC ENTRANCE CHOREOGRAPHY (0ms -> 480ms) ---
  if(elapsedMs < 480) {
    // 1. Title Drop (0 -> 320ms)
    const tProg = Math.min(1.0, elapsedMs / 320);
    const easeTitle = 1 - Math.pow(1 - tProg, 3);
    const tyTitle = -80 * (1 - easeTitle);
    pTitle.style.transform = `translateY(${tyTitle.toFixed(1)}px)`;
    pTitle.style.opacity = Math.min(1.0, tProg * 2.5).toFixed(2);

    // 2. Left and Right Fighter Cards Smash from Edges (0 -> 340ms)
    const cProg = Math.min(1.0, elapsedMs / 340);
    const easeCard = 1 - Math.pow(1 - cProg, 3);
    const txLeft = -120 * (1 - easeCard);
    const txRight = 120 * (1 - easeCard);
    pCardLeft.style.transform = `translateX(${txLeft.toFixed(1)}px)`;
    pCardLeft.style.opacity = Math.min(1.0, cProg * 2.5).toFixed(2);
    pCardRight.style.transform = `translateX(${txRight.toFixed(1)}px)`;
    pCardRight.style.opacity = Math.min(1.0, cProg * 2.5).toFixed(2);

    // 3. Center VS & Lightning Clash (Explodes at 220ms when cards meet!)
    if(elapsedMs < 220) {
      pVs.style.transform = 'scale(0.1)';
      pVs.style.opacity = '0';
    } else {
      const vProg = Math.min(1.0, (elapsedMs - 220) / 220);
      let sVs = vProg < 0.4 ? (vProg / 0.4 * 1.35) : (1.35 - (vProg - 0.4) / 0.6 * 0.35);
      pVs.style.transform = `scale(${sVs.toFixed(3)})`;
      pVs.style.opacity = '1';
      pVs.style.filter = vProg < 0.35 ? 'brightness(180%) drop-shadow(0 0 35px #ffffff)' : 'none';
    }

    // 4. Caution Tape Elastic Whip (100ms -> 360ms)
    if(elapsedMs < 100) {
      pTape.style.transform = 'scaleX(0.2)';
      pTape.style.opacity = '0';
    } else {
      const tapeProg = Math.min(1.0, (elapsedMs - 100) / 260);
      const easeTape = Math.sin((tapeProg * Math.PI) / 2);
      const sxTape = 0.4 + 0.6 * easeTape;
      pTape.style.transform = `scaleX(${sxTape.toFixed(3)})`;
      pTape.style.opacity = Math.min(1.0, tapeProg * 2.0).toFixed(2);
    }

    // 5. Bottom Question Card Slide Up (140ms -> 420ms)
    if(elapsedMs < 140) {
      pBottom.style.transform = 'translateY(90px)';
      pBottom.style.opacity = '0';
    } else {
      const bProg = Math.min(1.0, (elapsedMs - 140) / 280);
      const easeBot = 1 - Math.pow(1 - bProg, 3);
      const tyBot = 90 * (1 - easeBot);
      pBottom.style.transform = `translateY(${tyBot.toFixed(1)}px)`;
      pBottom.style.opacity = Math.min(1.0, bProg * 2.0).toFixed(2);
    }
  } else {
    // --- STAGE 2: 3D LIVING PARALLAX DEPTH DURING NARRATION (480ms -> tGlitch) ---
    // All elements locked at 100% assembled opacity with subtle micro 3D floating parallax
    const pTime = (elapsedMs - 480) / 1000.0;
    const floatL = (Math.sin(pTime * 2.2) * 2.5).toFixed(1);
    const floatR = (Math.cos(pTime * 2.0) * 2.5).toFixed(1);
    const pulseVs = (1.0 + 0.035 * Math.sin(pTime * 3.5)).toFixed(3);

    pTitle.style.transform = 'none'; pTitle.style.opacity = '1';
    pTape.style.transform = 'none'; pTape.style.opacity = '1';
    pCardLeft.style.transform = `translateY(${floatL}px)`; pCardLeft.style.opacity = '1';
    pCardRight.style.transform = `translateY(${floatR}px)`; pCardRight.style.opacity = '1';
    pVs.style.transform = `scale(${pulseVs})`; pVs.style.opacity = '1'; pVs.style.filter = 'none';
    pBottom.style.transform = 'none'; pBottom.style.opacity = '1';
  }
}

function renderTimelineState(elapsedMs){
  const shockwave = document.getElementById('canvasShockwave');
  const cardA = document.getElementById('cardA');
  const cardB = document.getElementById('cardB');
  const pollStage = document.getElementById('pollStage');

  const cues = getCues();

  // 1. Compute Deterministic Mathematical Frame Animations
  computeLogoFrameAnim(elapsedMs);
  computeHookLine1Anim(elapsedMs);
  computeHookLine2Anim(elapsedMs);
  computeOptionsAndClockStage(elapsedMs, cues);
  computeCardSpotlights(elapsedMs, cues);

  // 1.1 Ultra-Advanced Hypersonic Quantum Warp & Shockwave Transition
  const posterLayer = document.getElementById('openingPosterLayer');
  const posterVfxLayer = document.getElementById('posterVfxLayer');
  const posterImg = document.getElementById('openingPosterImg');
  const posterGroup = document.getElementById('posterLayerGroup');
  const flareStreak = document.getElementById('posterFlareStreak');
  const shockwaveRing = document.getElementById('posterShockwaveRing');
  const flashCurtain = document.getElementById('posterFlashCurtain');

  if(posterLayer) {
    if(!currentData.openingPoster && !currentData.openingPosterLayers) {
      posterLayer.style.display = 'none';
      if(posterVfxLayer) posterVfxLayer.style.display = 'none';
    } else {
      const posterDur = currentData.openingPosterDuration || cues.t_line2_start || 1800;
      const blastDur = 220; // explosive zoom & shockwave window
      const preGlitchDur = 240; // chromatic rumble window
      const tBlast = posterDur - blastDur;
      const tGlitch = tBlast - preGlitchDur;

      if(elapsedMs < posterDur) {
        posterLayer.style.display = 'block';
        if(posterVfxLayer) posterVfxLayer.style.display = 'block';

        if(currentData.openingPosterLayers && posterGroup) {
          computeLayeredPosterAnim(elapsedMs, posterDur, tGlitch);
        }

        if(elapsedMs < tGlitch) {
          // --- STAGE 1: Cinematic Hollywood Push-In to Full Screen Width (0ms -> tGlitch) ---
          const t1 = elapsedMs / Math.max(1, tGlitch);
          const ease1 = Math.sin((t1 * Math.PI) / 2);
          const s = (1.0000 + 0.2200 * ease1).toFixed(4);
          if(posterImg) {
            posterImg.style.transform = `scale(${s})`;
            posterImg.style.filter = 'none';
          }
          if(posterGroup) {
            posterGroup.style.transform = `scale(${s})`;
            posterGroup.style.filter = 'none';
          }
          posterLayer.style.opacity = '1';
          if(flareStreak) flareStreak.style.opacity = '0';
          if(shockwaveRing) shockwaveRing.style.opacity = '0';
          if(flashCurtain) flashCurtain.style.opacity = '0';
        } else if(elapsedMs < tBlast) {
          // --- STAGE 2: Seismic Pre-Shock Rumble & RGB Glitch (tGlitch -> tBlast) ---
          const p2 = (elapsedMs - tGlitch) / preGlitchDur;
          // High-frequency tremor
          const jx = (Math.sin(p2 * 35) * 3.5).toFixed(1);
          const jy = (Math.cos(p2 * 28) * 2.0).toFixed(1);
          // Snap recoil
          const s2 = (1.2200 - 0.0350 * Math.sin(p2 * Math.PI)).toFixed(4);
          const filterStr = `drop-shadow(-4px 0 0 rgba(0,240,255,0.75)) drop-shadow(4px 0 0 rgba(255,0,90,0.65)) contrast(125%) brightness(${1.0 + 0.3 * p2})`;
          if(posterImg) {
            posterImg.style.transform = `scale(${s2}) translate(${jx}px, ${jy}px)`;
            posterImg.style.filter = filterStr;
          }
          if(posterGroup) {
            posterGroup.style.transform = `scale(${s2}) translate(${jx}px, ${jy}px)`;
            posterGroup.style.filter = filterStr;
          }
          posterLayer.style.opacity = '1';
          if(flareStreak) {
            flareStreak.style.opacity = (p2 * 0.4).toFixed(3);
            flareStreak.style.transform = `scaleY(${p2 * 0.6}) scaleX(${p2})`;
          }
          if(shockwaveRing) shockwaveRing.style.opacity = '0';
          if(flashCurtain) flashCurtain.style.opacity = (p2 * 0.15).toFixed(3);
        } else {
          // --- STAGE 3: THE HYPERSONIC SUPERNOVA BLAST & EXPANDING SHOCKWAVE (tBlast -> posterDur) ---
          const p3 = (elapsedMs - tBlast) / blastDur;
          // Exponential Warp Zoom (1.20 -> 1.66!)
          const s3 = (1.2000 + 0.4600 * Math.pow(p3, 2.2)).toFixed(4);
          const blurPx = (p3 * 22).toFixed(1);
          const imgOp = Math.max(0, 1.0 - p3 * 1.35).toFixed(3);
          const blastFilter = `blur(${blurPx}px) brightness(${1.0 + 1.2 * (1 - p3)}) contrast(140%)`;
          if(posterImg) {
            posterImg.style.transform = `scale(${s3})`;
            posterImg.style.filter = blastFilter;
          }
          if(posterGroup) {
            posterGroup.style.transform = `scale(${s3})`;
            posterGroup.style.filter = blastFilter;
          }
          posterLayer.style.opacity = imgOp;

          // White-Hot Quantum Flash Curtain (peaks at 20% into blast, then dissolves)
          if(flashCurtain) {
            const flashOp = p3 < 0.25 ? (p3 / 0.25 * 0.95) : Math.max(0, 0.95 * (1 - (p3 - 0.25) / 0.75));
            flashCurtain.style.opacity = flashOp.toFixed(3);
          }

          // Anamorphic Sci-Fi Lens Flare Streak (horizontal laser blast)
          if(flareStreak) {
            const flOp = Math.max(0, 1.0 - p3 * 1.5).toFixed(3);
            flareStreak.style.opacity = flOp;
            flareStreak.style.transform = `scaleY(${Math.max(0.1, 1 - p3)}) scaleX(${1 + p3 * 2.5})`;
          }

          // Supersonic Neon Cyan Shockwave Ring (expands from scale 0.1 to 3.6)
          if(shockwaveRing) {
            const ringScale = (0.1 + 3.5 * Math.pow(p3, 0.65)).toFixed(3);
            const ringOp = Math.max(0, (1.0 - p3 * 1.05)).toFixed(3);
            shockwaveRing.style.transform = `scale(${ringScale})`;
            shockwaveRing.style.opacity = ringOp;
          }
        }
      } else {
        posterLayer.style.display = 'none';
        if(posterVfxLayer) posterVfxLayer.style.display = 'none';
      }
    }
  }

  // ==========================================
  // PHASE 1: 0ms -> t_line2_start (Hook & Complete Question Card Entry)
  // ==========================================
  if(elapsedMs < cues.t_line2_start){
    // Explosive Hook Impact Trigger at 0.0s!
    if(!hookImpactTriggered && elapsedMs >= 0 && elapsedMs <= 200){
      hookImpactTriggered = true;
      playHookImpact();
      if(shockwave) shockwave.classList.add('active');
    }

    if(cardA) {
      cardA.style.opacity = '0';
      cardA.style.transform = 'translateY(2cqw) scale(0.96)';
    }
    if(cardB) {
      cardB.style.opacity = '0';
      cardB.style.transform = 'translateY(2cqw) scale(0.96)';
    }
    if(pollStage) {
      pollStage.style.opacity = '0';
      pollStage.style.transform = 'translateY(2.4cqw) scale(0.96)';
      pollStage.style.pointerEvents = 'none';
    }

    setClock(10);
    lastTickWholeSec = null;
    line2ImpactTriggered = false;
    heartbeatTriggered = false;
    whooshTriggered = false;
  }
  // ==========================================
  // PHASE 2: t_line2_start -> t_clock_in (Line 2 & Code Cells Reading Stage)
  // ==========================================
  else if(elapsedMs >= cues.t_line2_start && elapsedMs < cues.t_clock_in){
    // Line 2 Kinetic Pop Impact
    if(!line2ImpactTriggered && elapsedMs >= cues.t_line2_start && elapsedMs <= cues.t_line2_start + 250){
      line2ImpactTriggered = true;
      playLine2Impact();
    }

    if(pollStage) {
      pollStage.style.opacity = '0';
      pollStage.style.transform = 'translateY(2.4cqw) scale(0.96)';
      pollStage.style.pointerEvents = 'none';
    }

    setClock(10);
    lastTickWholeSec = null;
    heartbeatTriggered = false;
    whooshTriggered = false;
  }
  // ==========================================
  // PHASE 3: t_clock_in -> t_clock_out (⏱️ Clock Active + Choose + Opt A + Opt B + Tension)
  // ==========================================
  else if(elapsedMs >= cues.t_clock_in && elapsedMs < cues.t_clock_out){
    if(!whooshTriggered && elapsedMs >= cues.t_clock_in && elapsedMs <= cues.t_clock_in + 300){
      whooshTriggered = true;
      playWhoosh();
    }

    // Dynamic countdown calculation from cues
    const clockDur = cues.clockDurationMs || (cues.t_clock_out - cues.t_clock_in) || 7340;
    const intoClock = elapsedMs - cues.t_clock_in;
    const remaining = Math.max(0, 10 - (intoClock / (clockDur / 10)));
    setClock(remaining, 10);

    const wholeSec = Math.ceil(remaining);
    if(wholeSec !== lastTickWholeSec && wholeSec >= 0 && wholeSec <= 9){
      lastTickWholeSec = wholeSec;
      playTickSound(wholeSec);
    }

    if(pollStage) {
      pollStage.style.opacity = '0';
      pollStage.style.transform = 'translateY(2.4cqw) scale(0.96)';
      pollStage.style.pointerEvents = 'none';
    }
    heartbeatTriggered = false;
  }
  // ==========================================
  // PHASE 4: t_clock_out -> totalMs (Clock DISAPPEARS, Poll CTA Rises & Voice Says "Comment below"!)
  // ==========================================
  else if(elapsedMs >= cues.t_clock_out){
    if(!pollEntranceTriggered){
      pollEntranceTriggered = true;
      playPollEntranceSFX();
    }

    setClock(0);

    // Buttery smooth mathematical cubic easing for pollStage
    const t = Math.min(1.0, Math.max(0, (elapsedMs - cues.t_clock_out) / 360));
    const ease = 1 - Math.pow(1 - t, 3);
    
    if(pollStage){
      pollStage.style.opacity = ease.toFixed(3);
      const translateY = ((1 - ease) * 2.4).toFixed(2);
      const scale = (0.96 + 0.04 * ease).toFixed(3);
      pollStage.style.transform = `translateY(${translateY}cqw) scale(${scale})`;
      pollStage.style.pointerEvents = 'auto';
    }

    const btnA = document.querySelector('.poll-btn-a');
    const btnB = document.querySelector('.poll-btn-b');
    const pill = document.getElementById('liveSandboxPill');

    const tBtnA = Math.min(1.0, Math.max(0, (elapsedMs - (cues.t_clock_out + 20)) / 300));
    const easeBtnA = 1 - Math.pow(1 - tBtnA, 3);
    if(btnA){
      btnA.style.opacity = easeBtnA.toFixed(3);
      btnA.style.transform = `translateX(${((1 - easeBtnA) * -2.2).toFixed(2)}cqw) scale(${(0.94 + 0.06 * easeBtnA).toFixed(3)})`;
    }

    const tBtnB = Math.min(1.0, Math.max(0, (elapsedMs - (cues.t_clock_out + 50)) / 300));
    const easeBtnB = 1 - Math.pow(1 - tBtnB, 3);
    if(btnB){
      btnB.style.opacity = easeBtnB.toFixed(3);
      btnB.style.transform = `translateX(${((1 - easeBtnB) * 2.2).toFixed(2)}cqw) scale(${(0.94 + 0.06 * easeBtnB).toFixed(3)})`;
    }

    const tPill = Math.min(1.0, Math.max(0, (elapsedMs - (cues.t_clock_out + 90)) / 300));
    const easePill = 1 - Math.pow(1 - tPill, 3);
    if(pill){
      pill.style.opacity = easePill.toFixed(3);
      pill.style.transform = `translateY(${((1 - easePill) * 1.6).toFixed(2)}cqw) scale(${(0.95 + 0.05 * easePill).toFixed(3)})`;
    }
  }

  // Render Kinetic Closed Captions (CC)
  renderCC(elapsedMs);
}

function getTotalMs(){
  if(currentData && currentData.cues && currentData.cues.totalMs){
    return currentData.cues.totalMs;
  }
  return 20000;
}

function tickTimeline(now){
  if(!isPlaying) return;
  const maxMs = getTotalMs();
  const elapsed = pausedTime + (now - startTime);
  if(elapsed >= maxMs){
    seekTimeline(maxMs);
    pauseTimeline();
    return;
  }

  renderTimelineState(elapsed);
  rafId = requestAnimationFrame(tickTimeline);
}

function playTimeline(){
  if(isPlaying) return;
  isPlaying = true;
  startTime = performance.now();
  
  // Standalone BGM Play
  const bgm = document.getElementById('templateBgmAudio');
  if(bgm && (window === window.top)){
    bgm.volume = 0.18;
    bgm.currentTime = pausedTime / 1000;
    bgm.play().catch(()=>{});
  }

  rafId = requestAnimationFrame(tickTimeline);
}

function pauseTimeline(){
  if(!isPlaying) return;
  pausedTime += (performance.now() - startTime);
  isPlaying = false;
  
  const bgm = document.getElementById('templateBgmAudio');
  if(bgm && (window === window.top)){
    bgm.pause();
  }

  if(rafId) cancelAnimationFrame(rafId);
}

function resetTimeline(){
  pauseTimeline();
  pausedTime = 0;
  lastTickWholeSec = null;
  hookImpactTriggered = false;
  line2ImpactTriggered = false;
  spotlightATriggered = false;
  spotlightBTriggered = false;
  pollEntranceTriggered = false;
  heartbeatTriggered = false;
  whooshTriggered = false;
  
  const bgm = document.getElementById('templateBgmAudio');
  if(bgm && (window === window.top)){
    bgm.pause();
    bgm.currentTime = 0;
  }

  const shockwave = document.getElementById('canvasShockwave');
  if(shockwave) shockwave.classList.remove('active');
  const line1 = document.getElementById('hookLine_0');
  if(line1) line1.classList.remove('hook-slam');
  const line2 = document.getElementById('hookLine_1');
  if(line2) line2.classList.remove('hook-slam-line2');
  lastRenderedPhraseIdx = null;
  renderTimelineState(0);
}

function seekTimeline(ms){
  const maxMs = getTotalMs();
  pausedTime = Math.max(0, Math.min(maxMs, ms));
  renderTimelineState(pausedTime);
}

function triggerAnims(){
  if(isPlaying){
    resetTimeline();
    playTimeline();
  } else {
    resetTimeline();
    playTimeline();
  }
}

    }
    const sEl = document.getElementById('sandboxUrl');
    if(sEl) sEl.textContent = shortDisplay;
  }

  applyFonts();
  renderHook();
  renderCodeCards();
  renderTimelineState(pausedTime);
}

window.ReelEngine = {
  load: function(d){
    applyData(d);
    resetTimeline();
  },
  patch: function(d){
    applyData(d);
  },
  play: function(){ playTimeline(); },
  pause: function(){ pauseTimeline(); },
  reset: function(){ resetTimeline(); },
  seek: function(ms){ seekTimeline(ms); },
  getState: function(){
    const maxMs = getTotalMs();
    const elapsed = isPlaying ? pausedTime + (performance.now() - startTime) : pausedTime;
    return { playing: isPlaying, elapsedMs: Math.min(maxMs, elapsed), totalMs: maxMs };
  },
  get TOTAL_MS(){
    return getTotalMs();
  }
};

window.addEventListener('message', function(ev){
  const msg = ev.data || {};
  if(msg.type === 'reel:load') window.ReelEngine.load(msg.data);
  else if(msg.type === 'reel:patch') window.ReelEngine.patch(msg.data);
  else if(msg.type === 'reel:play') window.ReelEngine.play();
  else if(msg.type === 'reel:pause') window.ReelEngine.pause();
  else if(msg.type === 'reel:reset') window.ReelEngine.reset();
  else if(msg.type === 'reel:seek') window.ReelEngine.seek(msg.ms);
});

setInterval(function(){
  if(window.parent && window.parent !== window){
    window.parent.postMessage({ type:'reel:state', state: window.ReelEngine.getState() }, '*');
  }
}, 80);

window.addEventListener('DOMContentLoaded', function(){
  applyFonts();
  renderHook();
  renderCodeCards();
  renderTimelineState(0);
  if(window.parent && window.parent !== window){
    window.parent.postMessage({ type: 'reel:ready' }, '*');
  }
});
</script>
</body>
</html>
